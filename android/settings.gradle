pluginManagement {
    repositories {
        google()
        // Google's copy of Maven Central first: Maven Central itself turns
        // away (HTTP 429) the shared CI machines when they ask too often.
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositories {
        google()
        // Google's copy of Maven Central first: Maven Central itself turns
        // away (HTTP 429) the shared CI machines when they ask too often.
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
        mavenCentral()
    }
}
rootProject.name = 'Nagus'
include ':app'
